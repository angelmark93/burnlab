[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send every route to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always revalidate the service worker so updates roll out immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
